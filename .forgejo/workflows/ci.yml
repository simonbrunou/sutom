# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI. Production deploys are separate:
# a Forgejo webhook makes Coolify (homelab CT 126) build every push to main with
# railpack, which serves build/ with Caddy (RAILPACK_SPA_OUTPUT_DIR=build,
# PUBLIC_SITE_URL=https://sutom.sbrn.eu). Cloudflare Pages served sutom.sbrn.eu
# until 2026-10-19. Runbook: homelab-stacks docs/operations/runbooks/ct-126-sutom.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the one Node pin: railpack builds production on it too.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before npm ci, so a Node pin that moved alone fails here, by name.
      - name: Check Node pins
        run: scripts/check-node-pins.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        env:
          BASE_PATH: ''
          PUBLIC_SITE_URL: https://sutom.sbrn.eu
        run: npm run build
