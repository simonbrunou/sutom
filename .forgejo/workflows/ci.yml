# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI. Production deploys are separate:
# a Forgejo webhook makes Coolify (homelab CT 126) build every push to main with
# railpack, which serves build/ with Caddy (RAILPACK_SPA_OUTPUT_DIR=build,
# PUBLIC_SITE_URL=https://sutom.sbrn.eu). Cloudflare Pages served sutom.sbrn.eu
# until 2026-10-19. Runbook: homelab-stacks docs/operations/runbooks/ct-126-sutom.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the graphify-out/ check finds a PR's merge base
      # with its base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR changes graphify-out/ only in a refresh by
      # scripts/refresh-graph.sh, committed alone, last (AGENTS.md,
      # `## graphify`). The event's head sha, never a merge commit; a push to
      # main has no base to diff against.
      - name: Check graphify-out/ changes
        if: github.event_name == 'pull_request'
        env:
          GRAPH_CHECK_BASE: origin/${{ github.base_ref }}
          GRAPH_CHECK_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-graph-diff.sh

      # .nvmrc is the one Node pin: railpack builds production on its major too
      # (an older patch can run there: docs/agents/node-version.md).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before npm ci, so a Node pin that moved alone fails here, by name.
      - name: Check Node pins
        run: scripts/check-node-pins.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        env:
          BASE_PATH: ''
          PUBLIC_SITE_URL: https://sutom.sbrn.eu
        run: npm run build

      # Reads build/ from the step above. The 750 kB chunk limit in
      # vite.config.ts stays silent if a static import puts the valid-guesses
      # list back in the home page chunk (#195), so this check guards it (#232).
      - name: Check the home page loads no valid-guesses list
        run: scripts/check-valid-guesses-lazy.sh
